services:
  # The Endee Vector Database
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-server
    ports:
      - "8080:8080"
    environment:
      NDD_NUM_THREADS: 0
      NDD_AUTH_TOKEN: ""
    volumes:
      - endee-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Your Legal RAG Application
  legal-app:
    build: .
    container_name: legal-rag-app
    ports:
      - "8501:8501"
    depends_on:
      endee:
        condition: service_started
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENDEE_HOST=http://endee:8080/api/v1
    volumes:
      - ./data:/app/data  # Persist data if needed
      - ./logs:/app/logs  # Save logs

volumes:
  endee-data: